    <h1>Formulář</h1>
    <p>Jednoduchý kontaktní formulář.</p>

    <form action="#" method="post">
        <label for="name">Jméno:</label>
        <input type="text" id="name" name="name" placeholder="Tvoje jméno" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="tvuj@email.cz" required>

        <label for="message">Zpráva:</label>
        <textarea id="message" name="message" rows="4" placeholder="Napiš sem zprávu..."></textarea>

        <button type="submit">Odeslat</button>
    </form>
</body>
</html>
